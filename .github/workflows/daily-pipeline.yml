name: Daily Pipeline

on:
  schedule:
    # Once daily, 6:00am EDT (UTC-4). Rationale: last MLB game starts ~10pm ET;
    # ~3h game + ~1h stat posting + ~1h buffer ≈ 3am settle, so 6am is safely clear.
    # (Cron is fixed-UTC and does not track DST — in EST this fires at 5am ET.)
    - cron: '0 10 * * *'     # 6:00am EDT daily — full run
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode'
        required: false
        default: 'full'
        type: choice
        options: [full, light]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write ESPN credentials
        env:
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: |
          printf 'ESPN_SWID = "%s"\nESPN_S2 = "%s"\n' "$ESPN_SWID" "$ESPN_S2" > espn_credentials.py

      - name: Initialize database and seed crosswalk
        run: python -m pipeline.init_db

      - name: Determine pipeline mode
        id: mode
        run: |
          # Scheduled runs are always full (once daily). workflow_dispatch can override.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          else
            echo "mode=full" >> $GITHUB_OUTPUT
          fi

      - name: Run pipeline
        run: python main.py --mode ${{ steps.mode.outputs.mode }}

      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/ data/player-crosswalk.csv
          git diff --staged --quiet || git commit -m "data: pipeline run $(date -u +'%Y-%m-%d %H:%M UTC') [${{ steps.mode.outputs.mode }}]"
          git push
