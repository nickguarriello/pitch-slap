name: Tests

# Runs on code pushes/PRs. Ignores data-only commits (the daily pipeline bot
# commits docs/data + the crosswalk CSV constantly — no need to re-run tests
# for those).
on:
  push:
    paths-ignore:
      - 'docs/data/**'
      - 'data/**'
  pull_request:
    paths-ignore:
      - 'docs/data/**'
      - 'data/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
