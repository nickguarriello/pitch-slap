<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitch Slap — Home</title>
<style>
:root {
  --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
  --text: #e2e8f0; --muted: #64748b; --accent: #3b82f6;
  --win: #22c55e; --loss: #ef4444; --warn: #f59e0b; --flip: #a78bfa;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
.tag-trade { background: rgba(245,158,11,.15); color: var(--warn); }
body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; }
nav { display: flex; gap: 0; background: var(--surface); border-bottom: 1px solid var(--border); }
nav a { padding: 12px 20px; text-decoration: none; color: var(--muted); font-weight: 500; }
nav a.active, nav a:hover { color: var(--text); border-bottom: 2px solid var(--accent); }
.banner { padding: 8px 20px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
.banner .ok { color: var(--win); } .banner .warn { color: var(--warn); } .banner .fail { color: var(--loss); }
.container { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }
h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
@media(max-width:700px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
.card h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 12px; }
.cat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.cat { text-align: center; padding: 10px 6px; border-radius: 6px; border: 1px solid var(--border); }
.cat .label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
.cat .state { font-size: 13px; font-weight: 700; margin: 4px 0; }
.cat .vals { font-size: 11px; color: var(--muted); }
.cat.WIN  { border-color: var(--win);  background: rgba(34,197,94,.08); }
.cat.LOSS { border-color: var(--loss); background: rgba(239,68,68,.08); }
.cat.FLIPPABLE { border-color: var(--flip); background: rgba(167,139,250,.08); }
.cat.FLOPPABLE { border-color: var(--win);  background: rgba(34,197,94,.04); }
.cat.TIE  { border-color: var(--border); }
.cat.UNKNOWN { border-color: var(--border); opacity: .5; }
.cat.WIN .state  { color: var(--win); }
.cat.LOSS .state { color: var(--loss); }
.cat.FLIPPABLE .state { color: var(--flip); }
.cat.FLOPPABLE .state { color: var(--win); opacity: .7; }
.constraint-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
.constraint-row:last-child { border-bottom: none; }
.constraint-row .label { color: var(--muted); font-size: 13px; }
.constraint-row .value { font-weight: 600; }
.alert { color: var(--warn); font-size: 12px; margin-top: 2px; }
.flag-row { padding: 8px 0; border-bottom: 1px solid var(--border); }
.flag-row:last-child { border-bottom: none; }
.flag-name { font-weight: 600; font-size: 13px; }
.flag-reason { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 700; margin-right: 4px; }
.tag-buy { background: rgba(34,197,94,.15); color: var(--win); }
.tag-sell { background: rgba(239,68,68,.15); color: var(--loss); }
.tag-fa { background: rgba(59,130,246,.15); color: var(--accent); }
.need-bar { height: 4px; border-radius: 2px; background: var(--border); margin-top: 4px; }
.need-fill { height: 4px; border-radius: 2px; background: var(--accent); }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="active">Home</a>
  <a href="matchup.html">Matchup</a>
  <a href="waivers.html">Waivers</a>
  <a href="players.html">Players</a>
  <a href="league.html">League</a>
</nav>
<div class="banner" id="banner">Loading...</div>

<div class="container">
  <h1>Pitch Slap</h1>
  <div class="subtitle" id="subtitle">Loading...</div>

  <div class="grid2" style="margin-bottom:20px">
    <div class="card">
      <h2>This Week's Matchup</h2>
      <div class="cat-grid" id="cat-grid"></div>
    </div>
    <div class="card">
      <h2>Constraints</h2>
      <div id="constraints"></div>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>Buy Low Targets</h2>
      <div id="buy-low-list"></div>
    </div>
    <div class="card">
      <h2>Trade Away — Sell High</h2>
      <div id="sell-high-list"></div>
    </div>
  </div>
</div>

<script>
async function load(url) {
  const r = await fetch(url + '?t=' + Date.now());
  return r.json();
}

function fmt(v, digits=1) {
  if (v == null) return '—';
  return typeof v === 'number' ? v.toFixed(digits) : v;
}

async function main() {
  const [status, matchup, roster, waivers] = await Promise.all([
    load('data/status.json'),
    load('data/matchup.json'),
    load('data/roster.json'),
    load('data/waivers.json'),
  ]);

  // Banner
  const valClass = status.validate_overall === 'pass' ? 'ok' : status.validate_overall === 'warn' ? 'warn' : 'fail';
  const c = status.constraints || {};
  const warnCount = status.validate_warnings || 0;
  const warnDetail = warnCount > 0 ? `${warnCount} stat checks flagged` : 'all checks passed';
  const rawMode = status.last_run_mode;
  const modeLabel = (!rawMode || rawMode === 'unknown')
    ? 'unknown — pipeline may not have completed fully'
    : rawMode;
  document.getElementById('banner').innerHTML =
    `<span>As of <b>${status.as_of || '—'}</b></span>` +
    `<span class="${valClass}" title="Checks data integrity: stat totals match ESPN, no unmatched player IDs, etc. Warnings are non-blocking but worth reviewing.">Data Quality: ${status.validate_overall?.toUpperCase() || '?'} — ${warnDetail}</span>` +
    `<span title="'full' runs all fetchers including Statcast. 'light' skips the weekly Statcast pull and uses the cached version.">Mode: ${modeLabel}</span>` +
    (c.acq_alert ? `<span class="warn">${c.acq_alert}</span>` : '') +
    (c.ip_alert   ? `<span class="warn">${c.ip_alert}</span>` : '');

  const catStateVals = Object.values(matchup.cat_states || {});
  const catsW = catStateVals.filter(s => s.gap != null && s.gap > 0).length;
  const catsL = catStateVals.filter(s => s.gap != null && s.gap < 0).length;
  const catsT = catStateVals.filter(s => s.gap != null && s.gap === 0).length;
  const tieStr = catsT > 0 ? ` / ${catsT}T` : '';
  document.getElementById('subtitle').textContent =
    `${catsW}W / ${catsL}L${tieStr} this week`;

  // Cat grid
  const cats = matchup.cat_states || {};
  const needs = matchup.need_weights || {};
  const catEl = document.getElementById('cat-grid');
  for (const [cat, s] of Object.entries(cats)) {
    const state = s.state || 'UNKNOWN';
    const needW = needs[cat] || 0;
    catEl.innerHTML += `
      <div class="cat ${state}">
        <div class="label">${cat}</div>
        <div class="state">${state}</div>
        <div class="vals">${fmt(s.my_val, cat==='OBP'?3:1)} / ${fmt(s.opp_val, cat==='OBP'?3:1)}</div>
        <div class="need-bar"><div class="need-fill" style="width:${needW*100}%"></div></div>
      </div>`;
  }

  // Constraints
  const cEl = document.getElementById('constraints');
  const cons = status.constraints || {};
  const rows = [
    ['Acquisitions', `${cons.acquisitions_used ?? '—'} / 7 used`, cons.acq_alert],
    ['IP Accumulated', `${cons.ip_accumulated ?? '—'} IP`, cons.ip_alert],
    ['Waiver Priority', `#${cons.waiver_priority ?? '—'}`, cons.waiver_alert],
  ];
  cEl.innerHTML = rows.map(([label, value, alert]) => `
    <div class="constraint-row">
      <div>
        <div class="label">${label}</div>
        ${alert ? `<div class="alert">${alert}</div>` : ''}
      </div>
      <div class="value">${value}</div>
    </div>`).join('');

  // Buy-low targets: wire pickups + trade targets from other teams
  const wireTargets  = (waivers.buy_low_fa    || []).slice(0, 3).map(p => ({...p, _tag: 'WIRE',  _cls: 'tag-fa'}));
  const tradeTargets = (waivers.buy_low_trade || []).slice(0, 3).map(p => ({...p, _tag: 'TRADE', _cls: 'tag-trade'}));
  const buyLowTargets = [...wireTargets, ...tradeTargets].slice(0, 5);

  const renderBuyLow = list => list.map(p => {
    const reasons = (p.reasons || p.buy_low_reasons || []).slice(0, 2).join(' · ');
    return `<div class="flag-row">
      <div class="flag-name">${p.name} <span class="tag ${p._cls}">${p._tag}</span></div>
      <div class="flag-reason">${reasons || '—'}</div>
    </div>`;
  }).join('') || '<div style="color:var(--muted);font-size:13px;padding:8px 0">No buy-low targets identified</div>';

  // Sell-high from your roster (trade candidates)
  const sellHighPlayers = (roster.players || []).filter(p => p.sell_high).slice(0, 5);
  const renderSellHigh = list => list.map(p => {
    const reasons = (p.sell_high_reasons || []).slice(0, 2).join(' · ');
    return `<div class="flag-row">
      <div class="flag-name">${p.name} <span class="tag tag-sell">SELL</span></div>
      <div class="flag-reason">${reasons || '—'}</div>
    </div>`;
  }).join('') || '<div style="color:var(--muted);font-size:13px;padding:8px 0">No sell-high candidates on roster</div>';

  document.getElementById('buy-low-list').innerHTML  = renderBuyLow(buyLowTargets);
  document.getElementById('sell-high-list').innerHTML = renderSellHigh(sellHighPlayers);
}

main().catch(e => { document.getElementById('banner').innerHTML = `<span class="fail">Error loading data: ${e.message}</span>`; });
</script>
</body>
</html>
