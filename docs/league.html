<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitch Slap — League</title>
<style>
:root { --bg:#0f1117;--surface:#1a1d27;--border:#2a2d3a;--text:#e2e8f0;--muted:#64748b;--accent:#3b82f6;--win:#22c55e;--loss:#ef4444;--warn:#f59e0b;--flip:#a78bfa; }
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px}
nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border)}
nav a{padding:12px 20px;text-decoration:none;color:var(--muted);font-weight:500}
nav a.active,nav a:hover{color:var(--text);border-bottom:2px solid var(--accent)}
.banner{padding:8px 20px;background:var(--surface);border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;gap:24px;flex-wrap:wrap}
.banner .warn{color:var(--warn)}
.container{max-width:1200px;margin:0 auto;padding:24px 20px}
h1{font-size:22px;font-weight:700;margin-bottom:20px}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:12px}
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.cat-tab{padding:5px 14px;border:1px solid var(--border);border-radius:20px;background:none;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
.cat-tab.active,.cat-tab:hover{border-color:var(--accent);color:var(--text);background:rgba(59,130,246,.1)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:20px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:8px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--text)}
th.sorted{color:var(--accent)}
td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.my-team td{background:rgba(59,130,246,.06);}
.rank{display:inline-block;width:22px;height:22px;border-radius:4px;text-align:center;line-height:22px;font-size:11px;font-weight:700}
.rank-1{background:rgba(245,158,11,.2);color:var(--warn)}
.rank-2{background:rgba(34,197,94,.15);color:var(--win)}
.rank-3{background:rgba(59,130,246,.15);color:var(--accent)}
.rank-other{background:var(--border);color:var(--muted)}
</style>
</head>
<body>
<nav>
  <a href="index.html">Home</a>
  <a href="matchup.html">Matchup</a>
  <a href="waivers.html">Waivers</a>
  <a href="players.html">Players</a>
  <a href="league.html" class="active">League</a>
  <a href="playoff.html">Playoffs</a>
  <a href="log.html">Log</a>
</nav>
<div class="banner" id="banner">Loading...</div>

<div class="container">
  <h1>League</h1>

  <div class="card">
    <h2>Category Rankings</h2>
    <div class="cat-tabs" id="cat-tabs"></div>
    <table>
      <thead>
        <tr>
          <th data-col="rank">#</th>
          <th data-col="team_name">Team</th>
          <th data-col="record" title="Matchup W-L-T record">Record</th>
          <th data-col="cat_wins" title="Cumulative category wins-losses-ties across all matchup weeks">Cat W-L-T</th>
          <th data-col="r">R</th>
          <th data-col="hr">HR</th>
          <th data-col="rbi">RBI</th>
          <th data-col="sb">SB</th>
          <th data-col="obp">OBP</th>
          <th data-col="k">K</th>
          <th data-col="qs">QS</th>
          <th data-col="era">ERA</th>
          <th data-col="whip">WHIP</th>
          <th data-col="svhd">SVHD</th>
        </tr>
      </thead>
      <tbody id="league-table"></tbody>
    </table>
  </div>
</div>

<script>
async function load(url){const r=await fetch(url+'?t='+Date.now());return r.json()}

const CATS=['R','HR','RBI','SB','OBP','K','QS','ERA','WHIP','SvHd'];
const CAT_LABELS={SvHd:'SVHD'};
const CAT_COLS={R:'r',HR:'hr',RBI:'rbi',SB:'sb',OBP:'obp',K:'k',QS:'qs',ERA:'era',WHIP:'whip',SvHd:'svhd'};
const LOWER_BETTER=new Set(['ERA','WHIP']);

function fmt(v,cat){
  if(v==null||v===undefined) return '—';
  if(cat==='OBP') return v.toFixed(3);
  if(cat==='ERA'||cat==='WHIP') return v.toFixed(2);
  return typeof v==='number'?v.toFixed(0):v;
}

// Heat color: rank 1=best green, rank n=worst red
function heatBg(rank, n){
  if(!rank||!n||n<2) return '';
  const t=(rank-1)/(n-1); // 0=best,1=worst
  if(t<=0.5){
    const intensity=0.28*(1-t*2);
    return `background:rgba(34,197,94,${intensity.toFixed(2)})`;
  } else {
    const intensity=0.28*((t-0.5)*2);
    return `background:rgba(239,68,68,${intensity.toFixed(2)})`;
  }
}

let leagueData=[];
let activeCat='R';
let myTeamId=null;
let sortCol='rank';
let sortDir=1;

function getTeamRank(team,cat){return (team.ranks||{})[cat]||null;}

function renderTable(){
  const n=leagueData.length;
  let rows=[...leagueData];
  rows.sort((a,b)=>{
    if(sortCol==='rank'){
      return ((getTeamRank(a,activeCat)||99)-(getTeamRank(b,activeCat)||99))*sortDir;
    }
    if(sortCol==='team_name') return (a.team_name||'').localeCompare(b.team_name||'')*sortDir;
    if(sortCol==='record'||sortCol==='cat_wins'){
      const av=a[sortCol]??-1, bv=b[sortCol]??-1;
      return (bv-av)*sortDir;
    }
    const field=CAT_COLS[sortCol]||sortCol;
    const av=a[field],bv=b[field];
    if(av==null&&bv==null) return 0;
    if(av==null) return 1; if(bv==null) return -1;
    return LOWER_BETTER.has(sortCol)?(av-bv)*sortDir:(bv-av)*sortDir;
  });

  const tbody=document.getElementById('league-table');
  tbody.innerHTML=rows.map(t=>{
    const isMe=t.espn_team_id===myTeamId;
    const rank=getTeamRank(t,activeCat);
    const catCells=CATS.map(cat=>{
      const r=getTeamRank(t,cat);
      const bg=heatBg(r,n);
      return `<td style="text-align:right;${bg}">${fmt(t[CAT_COLS[cat]],cat)}</td>`;
    }).join('');
    return `<tr class="${isMe?'my-team':''}">
      <td style="color:var(--muted);font-weight:600;text-align:center;font-size:12px">${rank||'—'}</td>
      <td><b>${t.team_name||'—'}</b>${isMe?' <span style="font-size:11px;color:var(--accent)">(you)</span>':''}</td>
      <td style="font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums">${t.record||'—'}</td>
      <td style="font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums">${t.cat_record||'—'}</td>
      ${catCells}
    </tr>`;
  }).join('');

  // Update sorted header highlight
  document.querySelectorAll('th[data-col]').forEach(th=>{
    th.classList.toggle('sorted', th.dataset.col===sortCol);
  });
}

async function main(){
  const [league,status]=await Promise.all([load('data/league.json'),load('data/status.json')]);

  const c=status.constraints||{};
  document.getElementById('banner').innerHTML=
    `<span>As of <b>${status.as_of||'—'}</b></span>`+
    (c.acq_alert?`<span class="warn">${c.acq_alert}</span>`:'')+
    (c.ip_alert?`<span class="warn">${c.ip_alert}</span>`:'');

  leagueData=(league.teams||[]).map(t=>({
    ...t,
    espn_team_id: t.team_id,
    team_name: t.team_name||('Team '+t.team_id),
    cat_wins: t.cat_wins||0,
    wins: t.wins||0,
    r:t.stats?.R, hr:t.stats?.HR, rbi:t.stats?.RBI, sb:t.stats?.SB,
    obp:t.stats?.OBP, k:t.stats?.K, qs:t.stats?.QS, era:t.stats?.ERA,
    whip:t.stats?.WHIP, svhd:t.stats?.SvHd,
  }));
  myTeamId=(leagueData.find(t=>t.is_my_team)||{}).espn_team_id||null;

  // Cat tabs — clicking re-sorts by that cat's rank
  const tabContainer=document.getElementById('cat-tabs');
  for(const cat of CATS){
    const btn=document.createElement('button');
    btn.className='cat-tab'+(cat===activeCat?' active':'');
    btn.textContent=CAT_LABELS[cat]||cat;
    btn.addEventListener('click',()=>{
      activeCat=cat;
      document.querySelectorAll('.cat-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      sortCol='rank'; sortDir=1;
      renderTable();
    });
    tabContainer.appendChild(btn);
  }

  // Sort headers — same col toggles direction, different col resets to best-first
  document.querySelectorAll('th[data-col]').forEach(th=>{
    th.addEventListener('click',()=>{
      const col=th.dataset.col;
      if(sortCol===col) sortDir*=-1;
      else{ sortCol=col; sortDir=1; }
      renderTable();
    });
  });

  renderTable();
}

main().catch(e=>{document.getElementById('banner').innerHTML=`<span style="color:var(--loss)">Error: ${e.message}</span>`;});
</script>
</body>
</html>
