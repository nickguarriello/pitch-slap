<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitch Slap — Players</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--border:#2a2d3a;--text:#e2e8f0;--muted:#64748b;--accent:#3b82f6;--win:#22c55e;--loss:#ef4444;--warn:#f59e0b;--flip:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px}
nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border)}
nav a{padding:12px 20px;text-decoration:none;color:var(--muted);font-weight:500}
nav a.active,nav a:hover{color:var(--text);border-bottom:2px solid var(--accent)}
.banner{padding:8px 20px;background:var(--surface);border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;gap:24px;flex-wrap:wrap}
.banner .warn{color:var(--warn)}
.container{max-width:1300px;margin:0 auto;padding:24px 20px}
h1{font-size:22px;font-weight:700;margin-bottom:16px}
.controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.win-btn{padding:5px 14px;border:1px solid var(--border);border-radius:20px;background:none;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.win-btn.active,.win-btn:hover{border-color:var(--accent);color:var(--text);background:rgba(59,130,246,.1)}
.search-wrap input{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:7px 12px;color:var(--text);font-size:13px;width:200px;outline:none}
.search-wrap input::placeholder{color:var(--muted)}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 0 6px;margin-top:4px;display:flex;align-items:center;gap:8px}
.stat-note{font-size:10px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:8px}
table{width:100%;border-collapse:collapse}
th{text-align:right;padding:7px 10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
th.left,td.left{text-align:left}
td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px;white-space:nowrap;text-align:right}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.section-row td{background:rgba(0,0,0,.25);color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:4px 10px;text-align:left!important}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;margin-right:2px}
.tag-buy{background:rgba(34,197,94,.15);color:var(--win)}
.tag-sell{background:rgba(239,68,68,.15);color:var(--loss)}
.tag-2s{background:rgba(167,139,250,.15);color:var(--flip)}
.tag-il{background:rgba(239,68,68,.1);color:var(--loss)}
.slot{color:var(--accent);font-size:11px;font-weight:600}
.pos{color:var(--muted);font-size:11px}
.bn-row td{opacity:.8}
.il-row td{opacity:.6}
.tip-wrap{position:relative;display:inline-block;margin-left:6px;vertical-align:middle}
.tip-btn{width:15px;height:15px;border-radius:50%;background:var(--border);color:var(--muted);font-size:9px;font-weight:700;border:none;cursor:default;display:inline-flex;align-items:center;justify-content:center}
.tip-box{display:none;position:absolute;left:20px;top:-4px;z-index:200;background:#1e2130;border:1px solid var(--border);border-radius:8px;padding:12px 14px;width:300px;font-size:11px;line-height:1.6;color:var(--text);box-shadow:0 4px 24px rgba(0,0,0,.5);white-space:normal}
.tip-box b{color:var(--accent)}.tip-box code{color:var(--warn);font-size:10px}
.tip-wrap:hover .tip-box{display:block}
</style>
</head>
<body>
<nav>
  <a href="index.html">Home</a>
  <a href="matchup.html">Matchup</a>
  <a href="waivers.html">Waivers</a>
  <a href="players.html" class="active">Players</a>
  <a href="league.html">League</a>
  <a href="playoff.html">Playoffs</a>
  <a href="log.html">Log</a>
</nav>
<div class="banner" id="banner">Loading...</div>

<div class="container">
  <h1>Players</h1>

  <div class="controls">
    <div style="display:flex;gap:6px" id="window-btns">
      <button class="win-btn" data-win="current">Current Matchup</button>
      <button class="win-btn" data-win="7d">7D</button>
      <button class="win-btn" data-win="14d">14D</button>
      <button class="win-btn" data-win="30d">30D</button>
      <button class="win-btn active" data-win="season">Season</button>
    </div>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Search players...">
    </div>
  </div>

  <div id="roster-content"></div>
</div>

<script>
async function load(url){const r=await fetch(url+'?t='+Date.now());return r.json()}
function fmt(v,d=0){if(v==null||v===undefined)return'—';return typeof v==='number'?v.toFixed(d):String(v)}

let allPlayers=[];
let activeWindow='season';
let searchStr='';

// ESPN active-hitter slot order
const SLOT_RANK={
  'C':0,'1B':2,'2B':3,'3B':4,'SS':5,
  '2B/SS':6,'1B/3B':7,'OF':8,'UTIL':10
};

function isPitcher(p){return /SP|RP/i.test(p.eligible_positions||'')}
function slotGroup(p){
  const s=(p.roster_slot||'').toUpperCase();
  const pit=isPitcher(p);
  if(s==='IL')  return pit?'il-p':'il-h';
  if(s==='BE')  return pit?'bn-p':'bn-h';
  if(s==='P')   return 'active-p';
  return 'active-h';
}
function slotRank(p){return SLOT_RANK[p.roster_slot]??15}
function spFirst(p){return /SP/i.test(p.eligible_positions||'')?0:1}
function getW(p){return (p.stats||{})[activeWindow]||{}}

function hRow(p,cls=''){
  const s=getW(p);const sc=p.statcast||{};
  const tags=[
    p.buy_low?'<span class="tag tag-buy">BOUNCE</span>':'',
    p.sell_high?'<span class="tag tag-sell">SELL</span>':'',
    p.two_start?'<span class="tag tag-2s">2-ST</span>':'',
  ].join('');
  return `<tr class="${cls}">
    <td class="slot left">${p.roster_slot||'—'}</td>
    <td class="left"><b>${p.name||'—'}</b></td>
    <td class="pos left">${p.eligible_positions||'—'}</td>
    <td>${fmt(s.r)}</td><td>${fmt(s.hr)}</td><td>${fmt(s.rbi)}</td>
    <td>${fmt(s.sb)}</td><td>${fmt(s.obp,4)}</td>
    <td>${fmt(sc.xwoba,3)}</td><td>${fmt(s.babip,3)}</td>
    <td class="left">${tags||'—'}</td>
  </tr>`;
}

function pRow(p,cls=''){
  const s=getW(p);const sc=p.statcast||{};
  const tags=[
    p.buy_low?'<span class="tag tag-buy">BOUNCE</span>':'',
    p.sell_high?'<span class="tag tag-sell">SELL</span>':'',
    p.two_start?'<span class="tag tag-2s">2-ST</span>':'',
  ].join('');
  return `<tr class="${cls}">
    <td class="slot left">${p.roster_slot||'—'}</td>
    <td class="left"><b>${p.name||'—'}</b></td>
    <td class="pos left">${p.eligible_positions||'—'}</td>
    <td>${fmt(s.k)}</td><td>${fmt(s.qs)}</td>
    <td>${fmt(s.era,4)}</td><td>${fmt(s.whip,4)}</td>
    <td>${fmt(s.svhd)}</td><td>${fmt(s.ip,1)}</td>
    <td>${fmt(sc.xfip,2)}</td><td>${fmt(sc.siera,2)}</td>
    <td class="left">${tags||'—'}</td>
  </tr>`;
}

const H_HEAD=`<tr>
  <th class="left">Slot</th><th class="left">Player</th><th class="left">Pos</th>
  <th title="Runs">R</th><th title="Home Runs">HR</th><th title="RBI">RBI</th>
  <th title="Stolen Bases">SB</th><th title="On-Base Percentage">OBP</th>
  <th title="Expected wOBA — Statcast, season only">xwOBA</th>
  <th title="Batting Avg on Balls in Play — luck indicator">BABIP</th>
  <th class="left">Flags</th>
</tr>`;

const P_HEAD=`<tr>
  <th class="left">Slot</th><th class="left">Player</th><th class="left">Pos</th>
  <th title="Strikeouts">K</th><th title="Quality Starts (6+ IP, ≤3 ER)">QS</th>
  <th title="Earned Run Average">ERA</th>
  <th title="Walks + Hits per Inning Pitched">WHIP</th>
  <th title="Saves + Holds">SVHD</th>
  <th title="Innings Pitched">IP</th>
  <th title="Expected FIP — Statcast, season only">xFIP</th>
  <th title="Skill-Interactive ERA — Statcast, season only">SIERA</th>
  <th class="left">Flags</th>
</tr>`;

function secRow(label,cols){
  return `<tr class="section-row"><td colspan="${cols}">${label}</td></tr>`;
}

function section(label,head,body,cols){
  if(!body)return'';
  return`<div class="section-label">${label}</div><div class="card"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

function render(){
  const q=searchStr.toLowerCase();
  const players=allPlayers.filter(p=>!q||p.name.toLowerCase().includes(q));

  const aH=players.filter(p=>slotGroup(p)==='active-h').sort((a,b)=>slotRank(a)-slotRank(b));
  const aP=players.filter(p=>slotGroup(p)==='active-p').sort((a,b)=>spFirst(a)-spFirst(b));
  const bnP=players.filter(p=>slotGroup(p)==='bn-p').sort((a,b)=>spFirst(a)-spFirst(b));
  const bnH=players.filter(p=>slotGroup(p)==='bn-h');
  const ilP=players.filter(p=>slotGroup(p)==='il-p').sort((a,b)=>spFirst(a)-spFirst(b));
  const ilH=players.filter(p=>slotGroup(p)==='il-h');

  const winLabel={
    season:'Season to date',current:'Current matchup',
    '7d':'Last 7 days','14d':'Last 14 days','30d':'Last 30 days'
  }[activeWindow]||activeWindow;

  const statNote=`<span class="stat-note">— ${winLabel}</span>`;
  const pitNote=`<span class="stat-note">— ${winLabel} &nbsp;·&nbsp; xFIP/SIERA always season</span>`;

  const TIP_H=`<span class="tip-wrap"><span class="tip-btn">?</span><div class="tip-box"><b>Hitter stats</b><br><br><b>xwOBA</b> — expected wOBA from exit velocity/launch angle (Statcast). Reflects true contact quality independent of luck. Season only.<br><br><b>BABIP</b> — batting avg on balls in play. League avg ~.295. Below .260 = likely bouncing back. Above .340 = likely to regress.<br><br><b>BOUNCE</b> — underperforming true skill (buy/trade for).<br><b>SELL</b> — overperforming (trade away before regression).<br><b>2-ST</b> — two starts this week.</div></span>`;
  const TIP_P=`<span class="tip-wrap"><span class="tip-btn">?</span><div class="tip-box"><b>Pitcher stats</b><br><br><b>xFIP</b> — FIP with HR/FB rate normalized to league avg. Removes park and fly-ball luck. Season only.<br><br><b>SIERA</b> — accounts for GB rate and K/BB quality. Most predictive ERA estimator available. Season only.<br><br><b>BOUNCE</b> — ERA inflated vs xFIP (regression candidate, buy).<br><b>SELL</b> — ERA well below xFIP (due for regression up, sell).<br><b>2-ST</b> — two starts this week (high streaming value).</div></span>`;

  let html='';
  if(aH.length)  html+=section(`Active Batters ${statNote} ${TIP_H}`,H_HEAD,aH.map(p=>hRow(p)).join(''));
  if(aP.length)  html+=section(`Active Pitchers ${pitNote} ${TIP_P}`,P_HEAD,aP.map(p=>pRow(p)).join(''));
  if(bnP.length) html+=section(`Bench — Pitchers ${pitNote} ${TIP_P}`,P_HEAD,bnP.map(p=>pRow(p,'bn-row')).join(''));
  if(bnH.length) html+=section(`Bench — Batters ${statNote} ${TIP_H}`,H_HEAD,bnH.map(p=>hRow(p,'bn-row')).join(''));
  if(ilP.length) html+=section(`IL — Pitchers ${pitNote} ${TIP_P}`,P_HEAD,ilP.map(p=>pRow(p,'il-row')).join(''));
  if(ilH.length) html+=section(`IL — Batters ${statNote} ${TIP_H}`,H_HEAD,ilH.map(p=>hRow(p,'il-row')).join(''));

  document.getElementById('roster-content').innerHTML=html;
}

async function main(){
  const [roster,status]=await Promise.all([load('data/roster.json'),load('data/status.json')]);

  const c=status.constraints||{};
  document.getElementById('banner').innerHTML=
    `<span>As of <b>${status.as_of||'—'}</b></span>`+
    (c.acq_alert?`<span class="warn">${c.acq_alert}</span>`:'')+
    (c.ip_alert?`<span class="warn">${c.ip_alert}</span>`:'');

  allPlayers=(roster.players||[]).map(p=>({
    ...p,
    roster_slot:        p.lineup_slot,
    eligible_positions: p.position,
  }));

  document.querySelectorAll('.win-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.win-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      activeWindow=btn.dataset.win;
      render();
    });
  });

  document.getElementById('search').addEventListener('input',e=>{
    searchStr=e.target.value;render();
  });

  render();
}

main().catch(e=>{document.getElementById('banner').innerHTML=`<span style="color:var(--loss)">Error: ${e.message}</span>`;});
</script>
</body>
</html>
