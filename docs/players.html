<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitch Slap — Players</title>
<style>
:root { --bg:#0f1117;--surface:#1a1d27;--border:#2a2d3a;--text:#e2e8f0;--muted:#64748b;--accent:#3b82f6;--win:#22c55e;--loss:#ef4444;--warn:#f59e0b;--flip:#a78bfa; }
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px}
nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border)}
nav a{padding:12px 20px;text-decoration:none;color:var(--muted);font-weight:500}
nav a.active,nav a:hover{color:var(--text);border-bottom:2px solid var(--accent)}
.banner{padding:8px 20px;background:var(--surface);border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;gap:24px;flex-wrap:wrap}
.banner .warn{color:var(--warn)}
.container{max-width:1200px;margin:0 auto;padding:24px 20px}
h1{font-size:22px;font-weight:700;margin-bottom:8px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filter-btn{padding:5px 14px;border:1px solid var(--border);border-radius:20px;background:none;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
.filter-btn.active,.filter-btn:hover{border-color:var(--accent);color:var(--text);background:rgba(59,130,246,.1)}
.search-wrap{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.search-wrap input{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:7px 12px;color:var(--text);font-size:13px;width:220px}
.search-wrap input::placeholder{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:8px 10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
th.sorted{color:var(--accent)}
td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;margin-right:2px}
.tag-buy{background:rgba(34,197,94,.15);color:var(--win)}
.tag-sell{background:rgba(239,68,68,.15);color:var(--loss)}
.tag-2s{background:rgba(167,139,250,.15);color:var(--flip)}
.tag-il{background:rgba(239,68,68,.1);color:var(--loss)}
.pos{color:var(--muted);font-size:11px;font-weight:600}
.slot{color:var(--accent);font-size:11px}
.count{font-size:12px;color:var(--muted);margin-bottom:8px}
</style>
</head>
<body>
<nav>
  <a href="index.html">Home</a>
  <a href="matchup.html">Matchup</a>
  <a href="waivers.html">Waivers</a>
  <a href="players.html" class="active">Players</a>
  <a href="league.html">League</a>
  <a href="playoff.html">Playoffs</a>
  <a href="log.html">Log</a>
</nav>
<div class="banner" id="banner">Loading...</div>

<div class="container">
  <h1>Players</h1>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="hitter">Hitters</button>
    <button class="filter-btn" data-filter="pitcher">Pitchers</button>
    <button class="filter-btn" data-filter="buy">Buy Low</button>
    <button class="filter-btn" data-filter="sell">Sell High</button>
    <button class="filter-btn" data-filter="il">IL</button>
  </div>

  <div class="search-wrap">
    <input type="text" id="search" placeholder="Search players...">
    <span class="count" id="count"></span>
  </div>

  <div class="card">
    <table>
      <thead><tr id="header-row"></tr></thead>
      <tbody id="player-table"></tbody>
    </table>
  </div>
</div>

<script>
async function load(url){const r=await fetch(url+'?t='+Date.now());return r.json()}
function fmt(v,d=1){if(v==null||v===undefined)return'—';return typeof v==='number'?v.toFixed(d):v}

let allPlayers=[];
let sortCol='name';
let sortDir=1;
let activeFilter='all';

// Column definitions per mode
const COLS = {
  hitter: [
    {col:'name',      label:'Player',  d:null},
    {col:'roster_slot',label:'Slot',   d:null},
    {col:'eligible_positions',label:'Pos',d:null},
    {col:'r_season',  label:'R',       d:0,   title:'Runs (season)'},
    {col:'hr_season', label:'HR',      d:0,   title:'Home Runs (season)'},
    {col:'rbi_season',label:'RBI',     d:0,   title:'RBI (season)'},
    {col:'sb_season', label:'SB',      d:0,   title:'Stolen Bases (season)'},
    {col:'obp_season',label:'OBP',     d:3,   title:'On-Base % (season)'},
    {col:'xwoba',     label:'xwOBA',   d:3,   title:'Expected wOBA (Statcast)'},
    {col:'babip',     label:'BABIP',   d:3,   title:'BABIP (season)'},
    {col:'flags',     label:'Flags',   d:null},
  ],
  pitcher: [
    {col:'name',      label:'Player',  d:null},
    {col:'roster_slot',label:'Slot',   d:null},
    {col:'eligible_positions',label:'Pos',d:null},
    {col:'k_season',  label:'K',       d:0,   title:'Strikeouts (season)'},
    {col:'qs_season', label:'QS',      d:0,   title:'Quality Starts (season)'},
    {col:'era_season',label:'ERA',     d:2,   title:'ERA (season)'},
    {col:'whip_season',label:'WHIP',   d:2,   title:'WHIP (season)'},
    {col:'svhd_season',label:'SVHD',   d:0,   title:'Saves+Holds (season)'},
    {col:'xfip',      label:'xFIP',    d:2,   title:'Expected FIP (Statcast)'},
    {col:'siera',     label:'SIERA',   d:2,   title:'SIERA (Statcast)'},
    {col:'flags',     label:'Flags',   d:null},
  ],
  all: [
    {col:'name',      label:'Player',  d:null},
    {col:'roster_slot',label:'Slot',   d:null},
    {col:'eligible_positions',label:'Pos',d:null},
    {col:'r_season',  label:'R',       d:0,   title:'Runs (season)'},
    {col:'hr_season', label:'HR',      d:0,   title:'Home Runs (season)'},
    {col:'obp_season',label:'OBP',     d:3,   title:'OBP (season)'},
    {col:'k_season',  label:'K',       d:0,   title:'Strikeouts (season)'},
    {col:'era_season',label:'ERA',     d:2,   title:'ERA (season)'},
    {col:'whip_season',label:'WHIP',   d:2,   title:'WHIP (season)'},
    {col:'xwoba',     label:'xwOBA',   d:3,   title:'Expected wOBA'},
    {col:'xfip',      label:'xFIP',    d:2,   title:'Expected FIP'},
    {col:'flags',     label:'Flags',   d:null},
  ],
};

function colMode(){
  if(activeFilter==='hitter') return 'hitter';
  if(activeFilter==='pitcher') return 'pitcher';
  return 'all';
}

function isHitter(p){
  const pos=(p.eligible_positions||'').toUpperCase();
  return /C|1B|2B|3B|SS|OF|MI|CI|UTIL/.test(pos) && !/^SP$|^RP$/.test(pos);
}
function isPitcher(p){
  return /SP|RP/.test((p.eligible_positions||'').toUpperCase());
}

function renderHeader(cols){
  document.getElementById('header-row').innerHTML=cols.map(c=>
    `<th data-col="${c.col}"${c.title?` title="${c.title}"`:''}${c.col===sortCol?' class="sorted"':''}>${c.label}</th>`
  ).join('');
  document.querySelectorAll('th[data-col]').forEach(th=>{
    th.addEventListener('click',()=>{
      const col=th.dataset.col;
      if(col==='flags') return;
      if(sortCol===col) sortDir*=-1;
      else{sortCol=col;sortDir=col==='name'?1:-1;}
      renderTable();
    });
  });
}

function renderTable(){
  const search=document.getElementById('search').value.toLowerCase();
  let rows=allPlayers.filter(p=>{
    if(search && !p.name?.toLowerCase().includes(search)) return false;
    if(activeFilter==='hitter')  return isHitter(p);
    if(activeFilter==='pitcher') return isPitcher(p);
    if(activeFilter==='buy')     return p.buy_low;
    if(activeFilter==='sell')    return p.sell_high;
    if(activeFilter==='il')      return (p.roster_slot||'').toUpperCase()==='IL';
    return true;
  });

  rows.sort((a,b)=>{
    let av=a[sortCol],bv=b[sortCol];
    if(av==null && bv==null) return 0;
    if(av==null) return 1;
    if(bv==null) return -1;
    if(typeof av==='string') return av.localeCompare(bv)*sortDir;
    return (av-bv)*sortDir;
  });

  document.getElementById('count').textContent=`${rows.length} players`;

  const cols=COLS[colMode()];
  renderHeader(cols);

  const tbody=document.getElementById('player-table');
  tbody.innerHTML=rows.map(p=>{
    const flags=[];
    if(p.buy_low)  flags.push('<span class="tag tag-buy">BOUNCE</span>');
    if(p.sell_high) flags.push('<span class="tag tag-sell">SELL</span>');
    if(p.two_start) flags.push('<span class="tag tag-2s">2-ST</span>');
    if((p.roster_slot||'').toUpperCase()==='IL') flags.push('<span class="tag tag-il">IL</span>');
    const flagCell=flags.join('')||'—';

    return `<tr>${cols.map(c=>{
      if(c.col==='name')               return `<td><b>${p.name||'—'}</b></td>`;
      if(c.col==='roster_slot')        return `<td class="slot">${p.roster_slot||'—'}</td>`;
      if(c.col==='eligible_positions') return `<td class="pos">${p.eligible_positions||'—'}</td>`;
      if(c.col==='flags')              return `<td>${flagCell}</td>`;
      return `<td>${fmt(p[c.col],c.d)}</td>`;
    }).join('')}</tr>`;
  }).join('');
}

async function main(){
  const [roster,status]=await Promise.all([load('data/roster.json'),load('data/status.json')]);

  const c=status.constraints||{};
  document.getElementById('banner').innerHTML=
    `<span>As of <b>${status.as_of||'—'}</b></span>`+
    (c.acq_alert?`<span class="warn">${c.acq_alert}</span>`:'')+
    (c.ip_alert?`<span class="warn">${c.ip_alert}</span>`:'');

  allPlayers=(roster.players||[]).map(p=>{
    const s=p.stats||{}; const ss=s.season||{}; const sc=p.statcast||{};
    return {
      ...p,
      roster_slot:        p.lineup_slot,
      eligible_positions: p.position,
      r_season:   ss.r,    hr_season:  ss.hr,  rbi_season: ss.rbi,
      sb_season:  ss.sb,   obp_season: ss.obp, k_season:   ss.k,
      qs_season:  ss.qs,   era_season: ss.era, whip_season: ss.whip,
      svhd_season: ss.svhd, babip: ss.babip,
      xwoba: sc.xwoba, xfip: sc.xfip, siera: sc.siera,
    };
  });

  document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter=btn.dataset.filter;
      // reset sort to sensible default per mode
      sortCol='name'; sortDir=1;
      renderTable();
    });
  });

  document.getElementById('search').addEventListener('input',renderTable);

  renderTable();
}

main().catch(e=>{document.getElementById('banner').innerHTML=`<span style="color:var(--loss)">Error: ${e.message}</span>`;});
</script>
</body>
</html>
